name: Build APK
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply update.zip and repair project layout
        run: |
          if [ -f update.zip ]; then
            rm -rf app/src/main/java/com/m3upro
            unzip -o update.zip
            rm -f update.zip
          fi
          rm -f M3u.kt MainVm.kt Model.kt Net.kt Portal.kt Store.kt Ui.kt
          printf '%s\n' 'plugins {' '    id("com.android.application") version "8.5.2" apply false' '    id("org.jetbrains.kotlin.android") version "1.9.24" apply false' '}' > build.gradle.kts
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply update and repair layout" || true
          git push || true
      - name: Bundle default playlist into the APK
        run: |
          mkdir -p app/src/main/assets
          if curl -fsSL --max-time 60 "https://raw.githubusercontent.com/saboorabd/Tamil-iptv-player/main/public/playlist.m3u" -o /tmp/default.m3u && grep -q "#EXTM3U" /tmp/default.m3u; then
            cp /tmp/default.m3u app/src/main/assets/default.m3u
            echo "Bundled $(grep -c '^#EXTINF' /tmp/default.m3u) channels"
          else
            echo "Repo playlist not available, skipping"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: M3UPro-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
